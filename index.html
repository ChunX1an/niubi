<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Pool</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#111827; font-family:system-ui,sans-serif; color:#f8fafc; }
  .game { width:min(96vw,1000px); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; }
  .hint { color:#cbd5e1; font-size:14px; }
  button { border:0; border-radius:10px; padding:10px 14px; font-weight:700; cursor:pointer; background:#e5e7eb; color:#111827; }
  canvas { width:100%; height:auto; display:block; border-radius:16px; background:#064e3b; box-shadow:0 18px 50px rgba(0,0,0,.35); touch-action:none; }
</style>
</head>
<body>
<main class="game">
  <div class="top">
    <div><h1>Mini Pool</h1><div class="hint">Aim with the mouse/touch, drag away from the cue ball, then release to shoot.</div></div>
    <button id="reset" type="button">New Rack</button>
  </div>
  <canvas id="table" width="1000" height="560" aria-label="Playable pool table"></canvas>
</main>
<script>
(() => {
  const canvas = document.getElementById('table');
  const ctx = canvas.getContext('2d');
  const reset = document.getElementById('reset');
  const W=1000,H=560, r=13, friction=0.992, maxPower=850;
  const rail={x:48,y:48,w:904,h:464};
  const pockets=[
    [rail.x,rail.y],[W/2,rail.y],[rail.x+rail.w,rail.y],
    [rail.x,rail.y+rail.h],[W/2,rail.y+rail.h],[rail.x+rail.w,rail.y+rail.h]
  ];
  let balls=[], cue, aiming=false, aimPoint={x:0,y:0}, dragPoint={x:0,y:0};

  function makeRack(){
    balls=[];
    cue={x:260,y:H/2,vx:0,vy:0,alive:true};
    const colors=['#f8fafc','#facc15','#38bdf8','#ef4444','#a855f7','#f97316','#22c55e','#f8fafc','#ec4899','#14b8a6'];
    let n=0, startX=700, startY=H/2;
    for(let row=0;row<4;row++){
      for(let col=0;col<=row;col++){
        balls.push({x:startX+row*r*1.75,y:startY+(col-row/2)*r*2.15,vx:0,vy:0,c:colors[n%colors.length],n:n+1,alive:true});
        n++;
      }
    }
  }
  function allBalls(){ return cue.alive ? [cue,...balls.filter(b=>b.alive)] : balls.filter(b=>b.alive); }
  function pos(e){
    const q=canvas.getBoundingClientRect();
    return {x:(e.clientX-q.left)*W/q.width,y:(e.clientY-q.top)*H/q.height};
  }
  function speed(b){return Math.hypot(b.vx,b.vy);}
  function pocketCheck(b){
    for(const p of pockets) if(Math.hypot(b.x-p[0],b.y-p[1])<25){b.alive=false;b.vx=b.vy=0;return true;}
    return false;
  }
  function wall(b){
    if(b.x-r<rail.x){b.x=rail.x+r;b.vx=Math.abs(b.vx)*.94}
    if(b.x+r>rail.x+rail.w){b.x=rail.x+rail.w-r;b.vx=-Math.abs(b.vx)*.94}
    if(b.y-r<rail.y){b.y=rail.y+r;b.vy=Math.abs(b.vy)*.94}
    if(b.y+r>rail.y+rail.h){b.y=rail.y+rail.h-r;b.vy=-Math.abs(b.vy)*.94}
  }
  function collisions(){
    const a=allBalls();
    for(let i=0;i<a.length;i++) for(let j=i+1;j<a.length;j++){
      const A=a[i],B=a[j],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy),min=r*2;
      if(d>0 && d<min){
        const nx=dx/d,ny=dy/d,over=(min-d)/2;
        A.x-=nx*over;A.y-=ny*over;B.x+=nx*over;B.y+=ny*over;
        const rvx=A.vx-B.vx,rvy=A.vy-B.vy,rel=rvx*nx+rvy*ny;
        if(rel>0) { A.vx-=rel*nx;A.vy-=rel*ny;B.vx+=rel*nx;B.vy+=rel*ny; }
      }
    }
  }
  function update(){
    for(const b of allBalls()){
      b.x+=b.vx;b.y+=b.vy;b.vx*=friction;b.vy*=friction;
      if(speed(b)<.03)b.vx=b.vy=0;
      if(!pocketCheck(b)) wall(b);
    }
    collisions();
    if(cue.alive && speed(cue)<.03) cue.vx=cue.vy=0;
    requestAnimationFrame(update); draw();
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#713f12';ctx.fillRect(18,18,W-36,H-36);
    ctx.fillStyle='#065f46';ctx.fillRect(rail.x,rail.y,rail.w,rail.h);
    for(const p of pockets){ctx.beginPath();ctx.arc(p[0],p[1],24,0,Math.PI*2);ctx.fillStyle='#020617';ctx.fill();}
    ctx.strokeStyle='rgba(255,255,255,.08)';ctx.strokeRect(rail.x+18,rail.y+18,rail.w-36,rail.h-36);
    for(const b of balls) if(b.alive) ball(b);
    if(cue.alive) ball(cue);
    if(aiming && cue.alive && allBalls().every(b=>speed(b)<.03)){
      ctx.setLineDash([8,8]);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cue.x,cue.y);ctx.lineTo(aimPoint.x,aimPoint.y);ctx.stroke();ctx.setLineDash([]);
      const power=Math.min(maxPower,Math.hypot(dragPoint.x-cue.x,dragPoint.y-cue.y)*5);
      ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(rail.x,rail.y-25,(rail.w)*power/maxPower,6);
    }
  }
  function ball(b){
    ctx.beginPath();ctx.arc(b.x,b.y,r,0,Math.PI*2);ctx.fillStyle=b.c;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.stroke();
    if(b!==cue){ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='9px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.n,b.x,b.y);}
  }
  canvas.addEventListener('pointerdown',e=>{
    if(!cue.alive || allBalls().some(b=>speed(b)>.1)) return;
    const p=pos(e); if(Math.hypot(p.x-cue.x,p.y-cue.y)<45){aiming=true;dragPoint=p;aimPoint=p;canvas.setPointerCapture(e.pointerId);}
  });
  canvas.addEventListener('pointermove',e=>{if(!aiming)return; const p=pos(e);dragPoint=p;aimPoint={x:cue.x+(cue.x-p.x),y:cue.y+(cue.y-p.y)};});
  canvas.addEventListener('pointerup',e=>{
    if(!aiming)return; aiming=false;
    const p=pos(e),dx=cue.x-p.x,dy=cue.y-p.y,d=Math.hypot(dx,dy);
    if(d<5)return;
    const power=Math.min(maxPower,d*5), k=power/d;
    cue.vx=dx*k;cue.vy=dy*k;
  });
  reset.addEventListener('click',makeRack);
  makeRack(); update();
})();
</script>
</body>
</html>
