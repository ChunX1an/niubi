<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Pool</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;font-family:system-ui,-apple-system,sans-serif;color:#f8fafc}
.app{width:min(96vw,1000px)}
.screen{display:none}.screen.active{display:block}
.menu{text-align:center;padding:40px 20px}
.logo{font-size:58px;line-height:1;margin-bottom:8px}
h1{font-size:42px;margin:0 0 8px;letter-spacing:-1px}
.subtitle{color:#cbd5e1;margin:0 auto 32px;max-width:520px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:650px;margin:auto}
.mode{min-height:120px;text-align:left;padding:20px;border:1px solid #374151;border-radius:16px;background:#1f2937;color:#f8fafc;cursor:pointer;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:#94a3b8}
.mode:disabled{cursor:not-allowed;opacity:.55;transform:none}
.mode .icon{font-size:30px}.mode h2{margin:8px 0 3px;font-size:19px}.mode p{margin:0;color:#cbd5e1;font-size:13px}
.footer{margin-top:28px;color:#94a3b8;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h3{font-size:20px;margin:0}.hint{color:#cbd5e1;font-size:14px}
button.action{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e5e7eb;color:#111827}
canvas{width:100%;height:auto;display:block;border-radius:16px;background:#064e3b;box-shadow:0 18px 50px rgba(0,0,0,.35);touch-action:none}
@media(max-width:600px){.modes{grid-template-columns:1fr}.menu{padding:25px 10px}h1{font-size:34px}.logo{font-size:48px}}
</style>
</head>
<body>
<main class="app">
<section id="menu" class="screen active">
  <div class="menu">
    <div class="logo">🎱</div>
    <h1>MINI POOL</h1>
    <p class="subtitle">Choose how you want to play.</p>
    <div class="modes">
      <button class="mode" id="quickPlay" type="button"><div class="icon">⚡</div><h2>Quick Play</h2><p>Jump straight onto the table and shoot.</p></button>
      <button class="mode" id="practice" type="button"><div class="icon">🎯</div><h2>Practice</h2><p>Practice your shots with no pressure.</p></button>
      <button class="mode" disabled type="button"><div class="icon">🎱</div><h2>8-Ball</h2><p>Classic 8-ball rules — coming soon.</p></button>
      <button class="mode" disabled type="button"><div class="icon">👥</div><h2>2 Players</h2><p>Local multiplayer — coming soon.</p></button>
    </div>
    <div class="footer">More game modes will be added as we build.</div>
  </div>
</section>

<section id="game" class="screen">
  <div class="top">
    <div><h3>🎱 Mini Pool</h3><div class="hint">Aim with the mouse/touch, drag away from the cue ball, then release.</div></div>
    <button class="action" id="menuBtn" type="button">Main Menu</button>
  </div>
  <canvas id="table" width="1000" height="560" aria-label="Playable pool table"></canvas>
</section>
</main>

<script>
(()=> {
const menu=document.getElementById('menu'),game=document.getElementById('game');
const quick=document.getElementById('quickPlay'),practice=document.getElementById('practice'),menuBtn=document.getElementById('menuBtn');
const canvas=document.getElementById('table'),ctx=canvas.getContext('2d');
const W=1000,H=560,r=13,friction=.992,maxPower=850;
const rail={x:48,y:48,w:904,h:464};
const pockets=[[48,48],[500,48],[952,48],[48,512],[500,512],[952,512]];
let balls=[],cue,aiming=false,aimPoint={x:0,y:0},animationId=null;

function makeRack(){
 balls=[]; cue={x:260,y:H/2,vx:0,vy:0,alive:true};
 const colors=['#f8fafc','#facc15','#38bdf8','#ef4444','#a855f7','#f97316','#22c55e','#ec4899','#14b8a6'];
 let n=0;
 for(let row=0;row<4;row++)for(let col=0;col<=row;col++){
   balls.push({x:700+row*r*1.75,y:H/2+(col-row/2)*r*2.15,vx:0,vy:0,c:colors[n%colors.length],n:++n,alive:true});
 }
}
function allBalls(){return cue.alive?[cue,...balls.filter(b=>b.alive)]:balls.filter(b=>b.alive)}
function speed(b){return Math.hypot(b.vx,b.vy)}
function pointerPos(e){const q=canvas.getBoundingClientRect();return{x:(e.clientX-q.left)*W/q.width,y:(e.clientY-q.top)*H/q.height}}
function checkPocket(b){for(const p of pockets)if(Math.hypot(b.x-p[0],b.y-p[1])<25){b.alive=false;b.vx=b.vy=0;return true}return false}
function walls(b){
 if(b.x-r<rail.x){b.x=rail.x+r;b.vx=Math.abs(b.vx)*.94}
 if(b.x+r>rail.x+rail.w){b.x=rail.x+rail.w-r;b.vx=-Math.abs(b.vx)*.94}
 if(b.y-r<rail.y){b.y=rail.y+r;b.vy=Math.abs(b.vy)*.94}
 if(b.y+r>rail.y+rail.h){b.y=rail.y+rail.h-r;b.vy=-Math.abs(b.vy)*.94}
}
function collisions(){
 const a=allBalls();
 for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){
  const A=a[i],B=a[j],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);
  if(d>0&&d<2*r){
   const nx=dx/d,ny=dy/d,o=(2*r-d)/2;
   A.x-=nx*o;A.y-=ny*o;B.x+=nx*o;B.y+=ny*o;
   const rvx=A.vx-B.vx,rvy=A.vy-B.vy,rel=rvx*nx+rvy*ny;
   if(rel>0){A.vx-=rel*nx;A.vy-=rel*ny;B.vx+=rel*nx;B.vy+=rel*ny}
  }
 }
}
function drawBall(b){
 ctx.beginPath();ctx.arc(b.x,b.y,r,0,Math.PI*2);ctx.fillStyle=b.c;ctx.fill();
 ctx.strokeStyle='rgba(0,0,0,.35)';ctx.stroke();
 if(b!==cue){ctx.fillStyle='rgba(0,0,0,.65)';ctx.font='9px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.n,b.x,b.y)}
}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#713f12';ctx.fillRect(18,18,W-36,H-36);
 ctx.fillStyle='#065f46';ctx.fillRect(rail.x,rail.y,rail.w,rail.h);
 for(const p of pockets){ctx.beginPath();ctx.arc(p[0],p[1],24,0,Math.PI*2);ctx.fillStyle='#020617';ctx.fill()}
 for(const b of balls)if(b.alive)drawBall(b);if(cue.alive)drawBall(cue);
 if(aiming&&cue.alive&&allBalls().every(b=>speed(b)<.1)){
  ctx.setLineDash([8,8]);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cue.x,cue.y);ctx.lineTo(aimPoint.x,aimPoint.y);ctx.stroke();ctx.setLineDash([]);
 }
}
function loop(){
 for(const b of allBalls()){b.x+=b.vx;b.y+=b.vy;b.vx*=friction;b.vy*=friction;if(speed(b)<.03)b.vx=b.vy=0;if(!checkPocket(b))walls(b)}
 collisions();draw();animationId=requestAnimationFrame(loop)
}
function start(){menu.classList.remove('active');game.classList.add('active');makeRack();if(!animationId)loop()}
function showMenu(){aiming=false;game.classList.remove('active');menu.classList.add('active')}
quick.addEventListener('click',start);practice.addEventListener('click',start);menuBtn.addEventListener('click',showMenu);
canvas.addEventListener('pointerdown',e=>{if(!cue.alive||allBalls().some(b=>speed(b)>.1))return;const p=pointerPos(e);if(Math.hypot(p.x-cue.x,p.y-cue.y)<50){aiming=true;aimPoint=p;canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener('pointermove',e=>{if(aiming)aimPoint=pointerPos(e)});
canvas.addEventListener('pointerup',e=>{if(!aiming)return;aiming=false;const p=pointerPos(e),dx=cue.x-p.x,dy=cue.y-p.y,d=Math.hypot(dx,dy);if(d>5){const power=Math.min(maxPower,d*5),k=power/d;cue.vx=dx*k;cue.vy=dy*k}});
})();
</script>
</body>
</html>
