<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Pool</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <section id="main-menu" class="screen active">
      <div class="menu">
        <div class="logo">🎱</div>
        <h1>MINI POOL</h1>
        <p class="subtitle">Choose how you want to play.</p>
        <div class="modes">
          <button class="mode-button" data-mode="quick">⚡<strong>Quick Play</strong><span>Jump straight onto the table.</span></button>
          <button class="mode-button" data-mode="practice">🎯<strong>Practice</strong><span>Practice your shots with no pressure.</span></button>
          <button class="mode-button" data-mode="eight-ball" disabled>🎱<strong>8-Ball</strong><span>Coming soon.</span></button>
          <button class="mode-button" data-mode="two-player" disabled>👥<strong>2 Players</strong><span>Coming soon.</span></button>
        </div>
      </div>
    </section>

    <section id="game-screen" class="screen">
      <header class="game-header">
        <div>
          <h2 id="game-mode-title">Quick Play</h2>
          <p id="game-hint">Drag backward from the cue ball and release to shoot.</p>
        </div>
        <div class="actions">
          <button id="new-rack" type="button">New Rack</button>
          <button id="main-menu-button" type="button">Main Menu</button>
        </div>
      </header>

      <canvas id="pool-table" width="1000" height="560" aria-label="Playable pool table"></canvas>
      <p id="status" class="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/table.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
