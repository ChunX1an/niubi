<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Pool</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;font-family:system-ui,-apple-system,sans-serif;color:#f8fafc}
.app{width:min(96vw,1000px)}
.screen{display:none}.screen.active{display:block}
.menu{text-align:center;padding:40px 20px}
.logo{font-size:58px;line-height:1;margin-bottom:8px}
h1{font-size:42px;margin:0 0 8px}.subtitle{color:#cbd5e1;margin:0 auto 32px;max-width:520px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:650px;margin:auto}
.mode{min-height:120px;text-align:left;padding:20px;border:1px solid #374151;border-radius:16px;background:#1f2937;color:#f8fafc;cursor:pointer;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:#94a3b8}.mode:disabled{cursor:not-allowed;opacity:.55;transform:none}
.mode .icon{font-size:30px}.mode h2{margin:8px 0 3px;font-size:19px}.mode p{margin:0;color:#cbd5e1;font-size:13px}
.gameTop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.gameTitle h2{margin:0;font-size:20px}.gameTitle p{margin:2px 0 0;color:#cbd5e1;font-size:14px}
.actions{display:flex;gap:8px}.action{min-height:44px;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e5e7eb;color:#111827}
canvas{width:100%;height:auto;display:block;border-radius:16px;background:#064e3b;box-shadow:0 18px 50px rgba(0,0,0,.35);touch-action:none}
.status{text-align:center;color:#cbd5e1;font-size:13px;margin-top:9px;min-height:20px}
@media(max-width:600px){.modes{grid-template-columns:1fr}.menu{padding:25px 10px}h1{font-size:34px}}
</style>
</head>
<body>
<main class="app">
<section id="menu" class="screen active">
<div class="menu">
<div class="logo">🎱</div><h1>MINI POOL</h1><p class="subtitle">Choose how you want to play.</p>
<div class="modes">
<button class="mode" id="quickPlay" type="button"><div class="icon">⚡</div><h2>Quick Play</h2><p>Jump straight onto the table and shoot.</p></button>
<button class="mode" id="practice" type="button"><div class="icon">🎯</div><h2>Practice</h2><p>Practice your shots with no pressure.</p></button>
<button class="mode" disabled type="button"><div class="icon">🎱</div><h2>8-Ball</h2><p>Classic 8-ball rules — coming soon.</p></button>
<button class="mode" disabled type="button"><div class="icon">👥</div><h2>2 Players</h2><p>Local multiplayer — coming soon.</p></button>
</div>
</div>
</section>

<section id="game" class="screen">
<div class="gameTop">
<div class="gameTitle"><h2>🎱 Quick Play</h2><p>Drag backward from the cue ball to aim and set power. Release to shoot.</p></div>
<div class="actions"><button class="action" id="newRack" type="button">New Rack</button><button class="action" id="menuBtn" type="button">Main Menu</button></div>
</div>
<canvas id="table" width="1000" height="560" aria-label="Playable pool table"></canvas>
<div class="status" id="status" aria-live="polite">Pull back from the cue ball to line up your shot.</div>
</section>
</main>

<script>
(()=> {
const menu=document.getElementById('menu'),game=document.getElementById('game'),quick=document.getElementById('quickPlay'),practice=document.getElementById('practice'),menuBtn=document.getElementById('menuBtn'),newRack=document.getElementById('newRack'),status=document.getElementById('status'),canvas=document.getElementById('table'),ctx=canvas.getContext('2d');
const W=1000,H=560,r=13,friction=.991,maxPower=850,rail={x:48,y:48,w:904,h:464};
const pockets=[[48,48],[500,48],[952,48],[48,512],[500,512],[952,512]];
let cue,balls=[],aiming=false,aimPoint={x:0,y:0},mode='quick',animationId=null;

function rack(){balls=[];cue={x:260,y:280,vx:0,vy:0,alive:true};const cs=['#facc15','#38bdf8','#ef4444','#a855f7','#f97316','#22c55e','#ec4899','#14b8a6','#f59e0b','#e5e7eb','#60a5fa','#f43f5e','#c084fc','#fb923c','#4ade80'];let n=0;
for(let row=0;row<5;row++)for(let col=0;col<=row;col++){balls.push({x:700+row*23,y:280+(col-row/2)*28,vx:0,vy:0,c:cs[n%cs.length],n:++n,alive:true})}
aiming=false;status.textContent='Pull back from the cue ball to line up your shot.'}
function all(){return(cue.alive?[cue]:[]).concat(balls.filter(b=>b.alive))}
function speed(b){return Math.hypot(b.vx,b.vy)}
function stopped(){return all().every(b=>speed(b)<.1)}
function pos(e){const q=canvas.getBoundingClientRect();return{x:(e.clientX-q.left)*W/q.width,y:(e.clientY-q.top)*H/q.height}}
function pocket(b){for(const p of pockets)if(Math.hypot(b.x-p[0],b.y-p[1])<25){b.alive=false;b.vx=b.vy=0;if(b===cue){status.textContent='Scratch! The cue ball was pocketed. Press New Rack to try again.'}else status.textContent='Nice shot!';return true}return false}
function walls(b){if(b.x-r<rail.x){b.x=rail.x+r;b.vx=Math.abs(b.vx)*.94}if(b.x+r>rail.x+rail.w){b.x=rail.x+rail.w-r;b.vx=-Math.abs(b.vx)*.94}if(b.y-r<rail.y){b.y=rail.y+r;b.vy=Math.abs(b.vy)*.94}if(b.y+r>rail.y+rail.h){b.y=rail.y+rail.h-r;b.vy=-Math.abs(b.vy)*.94}}
function collisions(){const a=all();for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const A=a[i],B=a[j],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);if(d>0&&d<2*r){const nx=dx/d,ny=dy/d,o=(2*r-d)/2;A.x-=nx*o;A.y-=ny*o;B.x+=nx*o;B.y+=ny*o;const rvx=A.vx-B.vx,rvy=A.vy-B.vy,rel=rvx*nx+rvy*ny;if(rel>0){A.vx-=rel*nx;A.vy-=rel*ny;B.vx+=rel*nx;B.vy+=rel*ny}}}}
function drawBall(b){ctx.beginPath();ctx.arc(b.x,b.y,r,0,Math.PI*2);ctx.fillStyle=b.c;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.45)';ctx.stroke();if(b!==cue){ctx.fillStyle='rgba(0,0,0,.65)';ctx.font='9px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.n,b.x,b.y)}}
function drawCue(){if(!aiming||!cue.alive||!stopped())return;const dx=cue.x-aimPoint.x,dy=cue.y-aimPoint.y,d=Math.hypot(dx,dy);if(d<1)return;const nx=dx/d,ny=dy/d;const power=Math.min(maxPower,d*5),pull=Math.min(85,d);const back=28+pull;const tipX=cue.x-nx*back,tipY=cue.y-ny*back,tailX=tipX-nx*360,tailY=tipY-ny*360;
ctx.save();ctx.lineCap='round';ctx.lineWidth=7;ctx.strokeStyle='#d6a96b';ctx.beginPath();ctx.moveTo(tailX,tailY);ctx.lineTo(tipX,tipY);ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#f5f5f5';ctx.beginPath();ctx.moveTo(tipX,tipY);ctx.lineTo(cue.x, cue.y);ctx.stroke();
ctx.setLineDash([8,8]);ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.72)';ctx.beginPath();ctx.moveTo(cue.x,cue.y);ctx.lineTo(cue.x+nx*420,cue.y+ny*420);ctx.stroke();ctx.restore();
ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(rail.x,rail.y-25,rail.w,6);ctx.fillStyle='#f8fafc';ctx.fillRect(rail.x,rail.y-25,rail.w*power/maxPower,6);
}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#713f12';ctx.fillRect(18,18,W-36,H-36);ctx.fillStyle='#07553f';ctx.fillRect(rail.x,rail.y,rail.w,rail.h);ctx.fillStyle='#0b3b30';ctx.fillRect(rail.x+18,rail.y+18,rail.w-36,rail.h-36);for(const p of pockets){ctx.beginPath();ctx.arc(p[0],p[1],25,0,Math.PI*2);ctx.fillStyle='#020617';ctx.fill()}balls.forEach(b=>b.alive&&drawBall(b));if(cue.alive)drawBall(cue);drawCue()}
function loop(){for(const b of all()){b.x+=b.vx;b.y+=b.vy;b.vx*=friction;b.vy*=friction;if(speed(b)<.03)b.vx=b.vy=0;if(!pocket(b))walls(b)}collisions();draw();animationId=requestAnimationFrame(loop)}
function start(m){mode=m;menu.classList.remove('active');game.classList.add('active');rack();if(!animationId)loop()}
quick.addEventListener('click',()=>start('quick'));practice.addEventListener('click',()=>start('practice'));newRack.addEventListener('click',rack);menuBtn.addEventListener('click',()=>{aiming=false;game.classList.remove('active');menu.classList.add('active')});
canvas.addEventListener('pointerdown',e=>{if(!cue.alive||!stopped())return;const p=pos(e);if(Math.hypot(p.x-cue.x,p.y-cue.y)<55){aiming=true;aimPoint=p;canvas.setPointerCapture(e.pointerId);status.textContent='Move farther back for more power.'}});
canvas.addEventListener('pointermove',e=>{if(aiming){aimPoint=pos(e);const d=Math.hypot(aimPoint.x-cue.x,aimPoint.y-cue.y),power=Math.min(100,Math.round(d*500/maxPower));status.textContent=`Power: ${power}% — release to shoot.`}});
canvas.addEventListener('pointerup',e=>{if(!aiming)return;aiming=false;const p=pos(e),dx=cue.x-p.x,dy=cue.y-p.y,d=Math.hypot(dx,dy);if(d>5){const power=Math.min(maxPower,d*5),k=power/d;cue.vx=dx*k;cue.vy=dy*k;status.textContent='Shot!'}})
rack();
})();
</script>
</body>
</html>
